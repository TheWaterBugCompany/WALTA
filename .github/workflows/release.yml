name: Release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: >
          Build environment.
          'test' = sandbox CERDI API + version suffix (-test) in TestFlight /
          Play Console + tag (v2.1.0.4-test).
          'production' = real CERDI API + clean tag (v2.1.0.4) — must be
          explicitly selected to avoid accidental prod releases.
        type: choice
        options:
          - test
          - production
        default: test
      version:
        description: >
          Version (e.g. 2.0.5.1). Leave empty to auto-increment the build
          number from the latest v* git tag (test or prod).
        required: false
        type: string
      platforms:
        description: Platforms to build
        type: choice
        options:
          - both
          - android
          - ios
        default: both
      skip_ci_gate:
        description: >
          Skip the requirement that the latest CI run on the release SHA
          succeeded. Use only when CI is red for a known unrelated reason
          (e.g. an intermittent flake) and you've manually verified the build.
        type: boolean
        default: false

# Only one release at a time
concurrency:
  group: release
  cancel-in-progress: false

env:
  GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

jobs:
  # ── Gate: latest CI run on this SHA must have succeeded ────────────────
  ci-gate:
    name: CI gate
    if: ${{ !inputs.skip_ci_gate }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify latest CI on release SHA succeeded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="$(git rev-parse HEAD)"
          echo "Checking CI status for $SHA"
          RESULT=$(gh run list \
            --workflow=ci.yml \
            --branch=main \
            --commit="$SHA" \
            --limit=1 \
            --json conclusion,status,url)
          if [ "$RESULT" = "[]" ]; then
            echo "::error::No CI run found for $SHA — push and wait, or set skip_ci_gate=true."
            exit 1
          fi
          STATUS=$(echo "$RESULT"     | jq -r '.[0].status')
          CONCLUSION=$(echo "$RESULT" | jq -r '.[0].conclusion')
          URL=$(echo "$RESULT"        | jq -r '.[0].url')
          if [ "$STATUS" != "completed" ]; then
            echo "::error::CI run on $SHA not complete (status=$STATUS). $URL"
            exit 1
          fi
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::CI run on $SHA conclusion=$CONCLUSION. $URL — fix or set skip_ci_gate=true."
            exit 1
          fi
          echo "CI run on $SHA succeeded: $URL"

  # ── Compute version (shared by both platform jobs) ─────────────────────
  prepare:
    name: Compute version
    needs: ci-gate
    if: always() && (needs.ci-gate.result == 'success' || needs.ci-gate.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      display_version: ${{ steps.version.outputs.display_version }}
      version_code: ${{ steps.version.outputs.version_code }}
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need full history for tags

      - name: Compute version and versionCode
        id: version
        run: |
          ENVIRONMENT="${{ inputs.environment }}"

          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            # Auto-increment build number from the latest release tag.
            # Test releases (v*-test) and production releases (v*) share
            # one build-number sequence so they never collide. Strip any
            # `-test` suffix before parsing the numeric.
            LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -1)
            if [ -n "$LATEST_TAG" ]; then
              CURRENT="${LATEST_TAG#v}"
              CURRENT="${CURRENT%-test}"
            else
              # No tags yet — fall back to 2.0.4.0 as the base version
              CURRENT="2.0.4.0"
            fi
            IFS='.' read -r major minor patch build <<< "$CURRENT"
            build=$((build + 1))
            VERSION="${major}.${minor}.${patch}.${build}"
          fi

          # Compute Android versionCode: major*10^9 + minor*10^7 + patch*10^4 + build
          IFS='.' read -r major minor patch build <<< "$VERSION"
          VERSION_CODE=$(( major * 1000000000 + minor * 10000000 + patch * 10000 + build ))

          # Test builds carry a -test suffix in DISPLAY_VERSION and the
          # git tag. Android versionName accepts alpha characters, so it
          # uses DISPLAY_VERSION. iOS CFBundleVersion / CFBundleShortVersionString
          # do not (Apple rejects non-integer suffixes), so the iOS build
          # uses the numeric VERSION and relies on TestFlight branding +
          # the sandbox CERDI endpoint to differentiate test from prod.
          if [ "$ENVIRONMENT" = "test" ]; then
            DISPLAY_VERSION="${VERSION}-test"
            TAG_NAME="v${VERSION}-test"
          else
            DISPLAY_VERSION="$VERSION"
            TAG_NAME="v${VERSION}"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "display_version=$DISPLAY_VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "Environment: $ENVIRONMENT"
          echo "Version: $DISPLAY_VERSION (versionCode: $VERSION_CODE, tag: $TAG_NAME)"

  # ── Android release ────────────────────────────────────────────────────
  release-android:
    name: Android release
    needs: prepare
    if: inputs.platforms != 'ios'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore node_modules cache
        id: node-modules-cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm install --ignore-scripts

      - name: Save node_modules cache
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Run install.sh
        run: sh install.sh

      - name: Bump version in tiapp.xml
        run: |
          DISPLAY_VERSION="${{ needs.prepare.outputs.display_version }}"
          VERSION_CODE="${{ needs.prepare.outputs.version_code }}"
          sed -i "s|<version>[^<]*</version>|<version>${DISPLAY_VERSION}</version>|" walta-app/tiapp.xml.template
          sed -i "s|android:versionCode=\"[^\"]*\"|android:versionCode=\"${VERSION_CODE}\"|" walta-app/tiapp.xml.template
          sed -i "s|android:versionName=\"[^\"]*\"|android:versionName=\"${DISPLAY_VERSION}\"|" walta-app/tiapp.xml.template
          # Regenerate tiapp.xml from updated template
          sed "s/GOOGLE_MAPS_API_KEY_PLACEHOLDER/$GOOGLE_MAPS_API_KEY/" \
            walta-app/tiapp.xml.template > walta-app/tiapp.xml
          echo "Updated to version $DISPLAY_VERSION (versionCode $VERSION_CODE)"

      - name: Create app config (production or test sandbox)
        run: |
          if [ "${{ inputs.environment }}" = "test" ]; then
            printf '{\n  "cerdiServerUrl": "%s",\n  "cerdiApiSecret": "%s"\n}\n' \
              "${{ secrets.CERDI_TEST_SERVER_URL }}" \
              "${{ secrets.CERDI_TEST_API_SECRET }}" \
              > walta-app/app/app-config.test.json
            echo "Wrote app-config.test.json — sandbox API"
          else
            printf '{\n  "cerdiServerUrl": "%s",\n  "cerdiApiSecret": "%s"\n}\n' \
              "${{ secrets.CERDI_SERVER_URL }}" \
              "${{ secrets.CERDI_API_SECRET }}" \
              > walta-app/app/app-config.production.json
            echo "Wrote app-config.production.json — production API"
          fi

      - name: Read Titanium SDK version
        id: ti-version
        run: |
          TI_SDK=$(grep -o '<sdk-version>[^<]*' walta-app/tiapp.xml | cut -d'>' -f2)
          echo "version=$TI_SDK" >> "$GITHUB_OUTPUT"

      - name: Restore Titanium SDK cache
        id: ti-sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.titanium/mobilesdk/linux/${{ steps.ti-version.outputs.version }}
          key: titanium-sdk-${{ steps.ti-version.outputs.version }}-linux

      - name: Install Titanium SDK
        if: steps.ti-sdk-cache.outputs.cache-hit != 'true'
        run: npx titanium sdk install ${{ steps.ti-version.outputs.version }} --no-prompt

      - name: Save Titanium SDK cache
        if: steps.ti-sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.titanium/mobilesdk/linux/${{ steps.ti-version.outputs.version }}
          key: titanium-sdk-${{ steps.ti-version.outputs.version }}-linux

      - name: Configure Titanium
        run: npx titanium config cli.logLevel info

      - name: Apply SDK patches
        run: npm run patch-sdk

      - name: Decode signing keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.keystore

      - name: Build signed release
        env:
          KEYSTORE: /tmp/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_SUBKEY: ${{ secrets.KEYSTORE_SUBKEY }}
        run: |
          if [ "${{ inputs.environment }}" = "test" ]; then
            npx grunt --platform=android --override-app-config=test clean release
          else
            npx grunt --platform=android clean release
          fi

      - name: Upload to Google Play (internal track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: net.thewaterbug.waterbug
          releaseFiles: builds/release/Waterbug.aab
          track: internal
          status: completed

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ needs.prepare.outputs.display_version }}
          path: builds/release/Waterbug.*

  # ── iOS release ────────────────────────────────────────────────────────
  release-ios:
    name: iOS release
    needs: prepare
    if: inputs.platforms != 'android'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          LATEST_XCODE=$(ls /Applications | grep -E '^Xcode_[0-9]+\.[0-9]+(\.[0-9]+)?\.app$' | sort -V | tail -1)
          echo "Selecting $LATEST_XCODE"
          sudo xcode-select -s "/Applications/$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore node_modules cache
        id: node-modules-cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm install --ignore-scripts

      - name: Save node_modules cache
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Run install.sh
        run: sh install.sh

      - name: Bump version in tiapp.xml
        run: |
          DISPLAY_VERSION="${{ needs.prepare.outputs.display_version }}"
          VERSION="${{ needs.prepare.outputs.version }}"
          VERSION_CODE="${{ needs.prepare.outputs.version_code }}"
          # Apple requires both CFBundleVersion AND CFBundleShortVersionString
          # to be composed of integers separated by periods — no alpha
          # characters allowed anywhere. Titanium maps <version> to both,
          # so write the numeric VERSION (no -test suffix). Test builds
          # remain identifiable by TestFlight branding + the sandbox CERDI
          # endpoint, not by an in-version marker.
          sed -i '' "s|<version>[^<]*</version>|<version>${VERSION}</version>|" walta-app/tiapp.xml.template
          sed -i '' "s|android:versionCode=\"[^\"]*\"|android:versionCode=\"${VERSION_CODE}\"|" walta-app/tiapp.xml.template
          sed -i '' "s|android:versionName=\"[^\"]*\"|android:versionName=\"${DISPLAY_VERSION}\"|" walta-app/tiapp.xml.template
          # Regenerate tiapp.xml from updated template
          sed "s/GOOGLE_MAPS_API_KEY_PLACEHOLDER/$GOOGLE_MAPS_API_KEY/" \
            walta-app/tiapp.xml.template > walta-app/tiapp.xml
          echo "Updated to version $VERSION (display $DISPLAY_VERSION, versionCode $VERSION_CODE)"

      - name: Create app config (production or test sandbox)
        run: |
          if [ "${{ inputs.environment }}" = "test" ]; then
            printf '{\n  "cerdiServerUrl": "%s",\n  "cerdiApiSecret": "%s"\n}\n' \
              "${{ secrets.CERDI_TEST_SERVER_URL }}" \
              "${{ secrets.CERDI_TEST_API_SECRET }}" \
              > walta-app/app/app-config.test.json
            echo "Wrote app-config.test.json — sandbox API"
          else
            printf '{\n  "cerdiServerUrl": "%s",\n  "cerdiApiSecret": "%s"\n}\n' \
              "${{ secrets.CERDI_SERVER_URL }}" \
              "${{ secrets.CERDI_API_SECRET }}" \
              > walta-app/app/app-config.production.json
            echo "Wrote app-config.production.json — production API"
          fi

      - name: Read Titanium SDK version
        id: ti-version
        run: |
          TI_SDK=$(grep -o '<sdk-version>[^<]*' walta-app/tiapp.xml | cut -d'>' -f2)
          echo "version=$TI_SDK" >> "$GITHUB_OUTPUT"

      - name: Restore Titanium SDK cache
        id: ti-sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Application Support/Titanium/mobilesdk/osx/${{ steps.ti-version.outputs.version }}
          key: titanium-sdk-${{ steps.ti-version.outputs.version }}-osx

      - name: Install Titanium SDK
        if: steps.ti-sdk-cache.outputs.cache-hit != 'true'
        run: npx titanium sdk install ${{ steps.ti-version.outputs.version }} --no-prompt

      - name: Save Titanium SDK cache
        if: steps.ti-sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Application Support/Titanium/mobilesdk/osx/${{ steps.ti-version.outputs.version }}
          key: titanium-sdk-${{ steps.ti-version.outputs.version }}-osx

      - name: Configure Titanium
        run: npx titanium config cli.logLevel info

      - name: Apply SDK patches
        run: npm run patch-sdk

      - name: Import code signing certificate
        env:
          P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          # Create a temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          echo "$P12_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Add to search list (before the default keychain)
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | tr -d '"')

          # Store keychain path for cleanup
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Install provisioning profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/${{ secrets.IOS_PROFILE_UUID }}.mobileprovision

      - name: Build signed release
        env:
          DEVELOPER: ${{ secrets.IOS_DEVELOPER_NAME }}
          PROFILE_DIST: ${{ secrets.IOS_PROFILE_UUID }}
        run: |
          if [ "${{ inputs.environment }}" = "test" ]; then
            npx grunt --platform=ios --override-app-config=test clean release
          else
            npx grunt --platform=ios clean release
          fi

      - name: Upload to TestFlight
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}" | base64 --decode \
            > ~/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8

          # altool has been observed to print "ERROR: …" and exit 0 on
          # upload rejection (e.g. CFBundleVersion violations). Capture
          # output and fail the step if any ERROR: line appears, even
          # when altool itself reports success.
          ALTOOL_LOG=$(mktemp)
          xcrun altool --upload-app --type ios \
            --file builds/release/Waterbug.ipa \
            --apiKey ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }} \
            --apiIssuer ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }} \
            2>&1 | tee "$ALTOOL_LOG"
          if grep -qE '^[0-9].* ERROR:' "$ALTOOL_LOG"; then
            echo "::error::altool printed ERROR: lines despite exit 0 — upload rejected"
            exit 1
          fi

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-${{ needs.prepare.outputs.display_version }}
          path: builds/release/Waterbug.ipa

  # ── Tag the release ────────────────────────────────────────────────────
  tag-release:
    name: Tag release
    needs: [prepare, release-android, release-ios]
    # Run if at least one platform job succeeded (the other may have been skipped)
    if: always() && (needs.release-android.result == 'success' || needs.release-ios.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create and push tag
        run: |
          TAG_NAME="${{ needs.prepare.outputs.tag_name }}"
          DISPLAY_VERSION="${{ needs.prepare.outputs.display_version }}"
          # Skip if the tag already exists on the remote — supports
          # iOS-only retries at the version Android already shipped.
          # Existing tag stays put; for a same-version retry the app
          # commit is unchanged so the tag is still accurate.
          if git ls-remote --exit-code --tags origin "${TAG_NAME}" >/dev/null 2>&1; then
            echo "Tag ${TAG_NAME} already on remote — skipping (likely a single-platform retry)"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG_NAME}" -m "Release ${DISPLAY_VERSION}"
          git push origin "${TAG_NAME}"
