name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 0. Detect changes ─────────────────────────────────────────────────────
  # Build/test jobs only run if files relevant to the build or its tests have
  # changed. Doc/graphics/ruleset-only PRs skip the expensive jobs entirely.
  # Skipped jobs report a "skipped" status which counts as success for
  # required-checks branch protection.
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            relevant:
              # App source & taxonomy
              - 'walta-app/**'
              - 'walta-taxonomy/walta/**'
              # Build configuration
              - 'Gruntfile.js'
              - 'package.json'
              - 'package-lock.json'
              - 'install.sh'
              - '.babelrc'
              - '.npmrc'
              - 'webpack.config.js'
              - 'patches/**'
              - 'plugins/**'
              # Build utilities
              - 'build-utils/**'
              # Test infrastructure
              - 'build-tests/**'
              - 'test/**'
              - 'test-resources/**'
              - 'features/**'
              - 'end-to-end-testing/**'
              - 'mocha-bootstrap.js'
              - 'wdio.conf.js'
              # CI workflow itself — any change re-runs everything
              - '.github/workflows/ci.yml'

  # ── 1. Node.js unit tests ─────────────────────────────────────────────────
  node-tests:
    name: Node.js unit tests
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore node_modules cache
        id: node-modules-cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm install --ignore-scripts

      - name: Save node_modules cache
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Run install.sh
        run: sh install.sh

      - name: Run Node.js unit tests
        run: npx grunt unit-test-node

      - name: Run cross-platform build tests
        run: npx grunt build-test

  # ── 2. iOS simulator unit tests ───────────────────────────────────────────
  ios-simulator-tests:
    name: iOS simulator unit tests
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          # Pick the highest Xcode version available (matches our App Store target)
          LATEST_XCODE=$(ls /Applications | grep -E '^Xcode_[0-9]+\.[0-9]+(\.[0-9]+)?\.app$' | sort -V | tail -1)
          echo "Selecting $LATEST_XCODE"
          sudo xcode-select -s "/Applications/$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore node_modules cache
        id: node-modules-cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm install --ignore-scripts

      - name: Save node_modules cache
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Run install.sh
        run: sh install.sh

      - name: Read Titanium SDK version
        id: ti-version
        run: |
          TI_SDK=$(grep -o '<sdk-version>[^<]*' walta-app/tiapp.xml | cut -d'>' -f2)
          echo "version=$TI_SDK" >> "$GITHUB_OUTPUT"

      - name: Restore Titanium SDK cache
        id: ti-sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Application Support/Titanium/mobilesdk/osx/${{ steps.ti-version.outputs.version }}
          key: titanium-sdk-${{ steps.ti-version.outputs.version }}-osx

      - name: Install Titanium SDK
        if: steps.ti-sdk-cache.outputs.cache-hit != 'true'
        run: npx titanium sdk install ${{ steps.ti-version.outputs.version }} --no-prompt

      - name: Save Titanium SDK cache
        if: steps.ti-sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Application Support/Titanium/mobilesdk/osx/${{ steps.ti-version.outputs.version }}
          key: titanium-sdk-${{ steps.ti-version.outputs.version }}-osx

      - name: Configure Titanium
        run: npx titanium config cli.logLevel info

      - name: Apply SDK patches
        run: npm run patch-sdk

      - name: Select iOS simulator
        id: sim
        run: |
          # Pick the iPhone running the highest iOS runtime
          SELECTED=$(xcrun simctl list devices available -j | jq -r '
            [.devices | to_entries[]
             | select(.key | test("iOS-[0-9]"))
             | {runtime: (.key | capture("iOS-(?<v>[0-9-]+)").v),
                devices: [.value[] | select(.name | contains("iPhone")) | select(.isAvailable)]}]
            | sort_by(.runtime | split("-") | map(tonumber)) | reverse
            | .[0]
            | .devices[0] | "\(.udid) \(.name)"')
          UDID=$(echo "$SELECTED" | cut -d" " -f1)
          NAME=$(echo "$SELECTED" | cut -d" " -f2-)
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Selected: $NAME ($UDID)"

      - name: Boot iOS simulator
        run: |
          # `bootstatus` without `-b` waits for the in-flight boot started
          # above; with `-b` it races to issue a second boot and fails with
          # SimError 405 once the device has reached "Booted" state.
          xcrun simctl boot ${{ steps.sim.outputs.udid }} || true
          xcrun simctl bootstatus ${{ steps.sim.outputs.udid }}
          echo "Simulator booted"

      - name: Run iOS build tests
        run: npx grunt build-test-ios

      - name: Sample simulator log format
        run: |
          xcrun simctl spawn ${{ steps.sim.outputs.udid }} log stream --style syslog 2>&1 | head -20 || true

      - name: Run iOS simulator unit tests
        env:
          SIM_UDID: ${{ steps.sim.outputs.udid }}
        # Same retry rationale as the Android jobs (WB-54): defence in
        # depth against transient SDK / runner flakes.
        run: |
          for attempt in 1 2; do
            if npx grunt --platform=ios --simulator unit-test; then
              exit 0
            fi
            echo "::warning ::iOS unit-test attempt $attempt failed; retrying once (WB-54)"
          done
          exit 1

      - name: Capture simulator diagnostics on failure
        if: failure()
        run: |
          echo "=== Simulator screenshot ==="
          xcrun simctl io ${{ steps.sim.outputs.udid }} screenshot /tmp/sim-screenshot.png || true
          echo "=== Last 200 lines of ALL simulator syslog ==="
          xcrun simctl spawn ${{ steps.sim.outputs.udid }} log show --last 5m --style syslog 2>&1 | grep -i "waterbug\|titanium\|TiAPI\|TiLog\|Unit Test\|mocha\|spec" | tail -200 || true
          echo "=== Check if Waterbug process is still running ==="
          xcrun simctl spawn ${{ steps.sim.outputs.udid }} launchctl list 2>&1 | grep -i waterbug || echo "Waterbug not in launchctl"
          echo "=== Check for crash reports ==="
          find ~/Library/Logs/DiagnosticReports -name "*Waterbug*" -newer /tmp/sim-screenshot.png 2>/dev/null | head -5 || echo "No crash reports found"

      - name: Upload simulator screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshot
          path: /tmp/sim-screenshot.png
          if-no-files-found: ignore

  # ── 3. Android emulator unit tests ────────────────────────────────────────
  # Runs on ubuntu-latest (x86_64) with an x86 emulator image.
  # - x86_64 ubuntu: KVM supports x86 guests natively ✓
  # - x86 arch: bundled Titanium modules ship x86 libs ✓
  # - API 30 google_apis: last Android API level with x86 system images ✓
  # - ubuntu-latest: cheapest runner option ✓
  # The AVD name "Medium_Phone_API_36.1" matches AndroidEmulatorLauncher.js.
  android-emulator-tests:
    name: Android emulator unit tests
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore node_modules cache
        id: node-modules-cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm install --ignore-scripts

      - name: Save node_modules cache
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Run install.sh
        run: sh install.sh

      - name: Add x86 ABI for emulator builds
        run: sed -i 's|<abi>arm64-v8a,armeabi-v7a</abi>|<abi>arm64-v8a,armeabi-v7a,x86</abi>|' walta-app/tiapp.xml

      - name: Read Titanium SDK version
        id: ti-version
        run: |
          TI_SDK=$(grep -o '<sdk-version>[^<]*' walta-app/tiapp.xml | cut -d'>' -f2)
          echo "version=$TI_SDK" >> "$GITHUB_OUTPUT"

      - name: Restore Titanium SDK cache
        id: ti-sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.titanium/mobilesdk/linux/${{ steps.ti-version.outputs.version }}
          key: titanium-sdk-${{ steps.ti-version.outputs.version }}-linux

      - name: Install Titanium SDK
        if: steps.ti-sdk-cache.outputs.cache-hit != 'true'
        run: npx titanium sdk install ${{ steps.ti-version.outputs.version }} --no-prompt

      - name: Save Titanium SDK cache
        if: steps.ti-sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.titanium/mobilesdk/linux/${{ steps.ti-version.outputs.version }}
          key: titanium-sdk-${{ steps.ti-version.outputs.version }}-linux

      - name: Configure Titanium
        run: npx titanium config cli.logLevel info

      - name: Apply SDK patches
        run: npm run patch-sdk

      - name: Enable KVM for hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Restore Android AVD cache
        id: avd-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
            /usr/local/lib/android/sdk/system-images/android-30
          key: avd-30-google_apis-x86

      - name: Pre-warm AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86
          avd-name: Medium_Phone_API_36.1
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: echo "AVD snapshot ready for caching"

      - name: Save Android AVD cache
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
            /usr/local/lib/android/sdk/system-images/android-30
          key: avd-30-google_apis-x86

      - name: Run Android build tests
        run: npx grunt build-test-android

      - name: Boot Android emulator and run tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86
          avd-name: Medium_Phone_API_36.1
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # Retry once on failure to absorb the intermittent AAPT
          # `Theme.WaterbugApp not found` resource-linker flake (WB-54).
          # Emulator stays booted across attempts so retry cost is just
          # the gradle+test cycle (~2.5 min). A genuine deterministic
          # failure still fails the job after the second attempt.
          script: |
            echo "Emulator booted"
            for attempt in 1 2; do
              if npx grunt --platform=android --simulator unit-test; then
                exit 0
              fi
              echo "::warning ::Android unit-test attempt $attempt failed; retrying once (WB-54)"
            done
            exit 1

  # ── 4. iOS simulator acceptance tests ─────────────────────────────────────
  ios-simulator-acceptance-tests:
    name: iOS simulator acceptance tests
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      # Stable path for the prebuilt WebDriverAgent DerivedData. Cached
      # across runs and passed to Appium via the derivedDataPath capability
      # so xcuitest-driver reuses the build instead of recompiling (saves
      # ~2-3 min per acceptance run).
      WDA_DERIVED_DATA_PATH: ${{ github.workspace }}/.wda-derived
      # Pinned Xcode version — the DerivedData cache is only reusable when
      # the same Xcode/toolchain built it, and unpinned runners drift
      # between versions. 26.3 is the current App Store submission target.
      XCODE_VERSION: "26.3"
    steps:
      - uses: actions/checkout@v4

      - name: Select pinned Xcode
        run: |
          XCODE_APP="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$XCODE_APP" ]; then
            echo "Xcode ${XCODE_VERSION} not installed on this runner. Available:" >&2
            ls /Applications | grep -E '^Xcode_' >&2
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore node_modules cache
        id: node-modules-cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm install --ignore-scripts

      - name: Save node_modules cache
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Run install.sh
        run: sh install.sh

      - name: Read Titanium SDK version
        id: ti-version
        run: |
          TI_SDK=$(grep -o '<sdk-version>[^<]*' walta-app/tiapp.xml | cut -d'>' -f2)
          echo "version=$TI_SDK" >> "$GITHUB_OUTPUT"

      - name: Restore Titanium SDK cache
        id: ti-sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Application Support/Titanium/mobilesdk/osx/${{ steps.ti-version.outputs.version }}
          key: titanium-sdk-${{ steps.ti-version.outputs.version }}-osx

      - name: Install Titanium SDK
        if: steps.ti-sdk-cache.outputs.cache-hit != 'true'
        run: npx titanium sdk install ${{ steps.ti-version.outputs.version }} --no-prompt

      - name: Save Titanium SDK cache
        if: steps.ti-sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Application Support/Titanium/mobilesdk/osx/${{ steps.ti-version.outputs.version }}
          key: titanium-sdk-${{ steps.ti-version.outputs.version }}-osx

      - name: Configure Titanium
        run: npx titanium config cli.logLevel info

      - name: Apply SDK patches
        run: npm run patch-sdk

      - name: Select iOS simulator
        id: sim
        run: |
          SELECTED=$(xcrun simctl list devices available -j | jq -r '
            [.devices | to_entries[]
             | select(.key | test("iOS-[0-9]"))
             | {runtime: (.key | capture("iOS-(?<v>[0-9-]+)").v),
                devices: [.value[] | select(.name | contains("iPhone")) | select(.isAvailable)]}]
            | sort_by(.runtime | split("-") | map(tonumber)) | reverse
            | .[0]
            | .devices[0] | "\(.udid) \(.name)"')
          UDID=$(echo "$SELECTED" | cut -d" " -f1)
          NAME=$(echo "$SELECTED" | cut -d" " -f2-)
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Selected: $NAME ($UDID)"

      - name: Boot iOS simulator with Simulator.app UI
        run: |
          SIM_UDID="${{ steps.sim.outputs.udid }}"
          STATE=$(xcrun simctl list devices -j | jq -r ".devices[][] | select(.udid==\"$SIM_UDID\") | .state")
          if [ "$STATE" = "Booted" ]; then
            echo "Simulator already booted — skipping boot"
          else
            # XCUITest driver refuses to drive a simulator booted headlessly
            # via simctl — it tries to relaunch with the GUI visible and then
            # times out. Boot via Simulator.app directly so the UI is up front.
            # `bootstatus` without `-b` just waits for the in-flight boot
            # started by `open -a Simulator` to finish; with `-b` it races
            # to issue a second boot command and fails with SimError 405
            # once the device has reached "Booted" state.
            open -a Simulator --args -CurrentDeviceUDID "$SIM_UDID"
            xcrun simctl bootstatus "$SIM_UDID"
          fi
          echo "Simulator boot step complete"

      # WebDriverAgent is built from source the first time XCUITest creates
      # a session (~2-3 min). Prebuild it into a stable workspace-local
      # path and cache it. Keyed on the pinned Xcode version and the
      # appium-webdriveragent package version — not package-lock.json — so
      # unrelated dependency bumps don't invalidate the cache.
      - name: Cache prebuilt WebDriverAgent
        id: wda-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.WDA_DERIVED_DATA_PATH }}
          key: wda-prebuilt-xcode-${{ env.XCODE_VERSION }}-${{ hashFiles('node_modules/appium-xcuitest-driver/node_modules/appium-webdriveragent/package.json') }}

      - name: Prebuild WebDriverAgent
        if: steps.wda-cache.outputs.cache-hit != 'true'
        run: bash build-utils/prebuild-wda.sh

      - name: Acceptance preflight (Appium launcher integration test)
        env:
          SIM_UDID: ${{ steps.sim.outputs.udid }}
        # Retry once (WB-54). The preflight is intentionally fast-fail
        # so the cost of a retry is small (~1 min).
        run: |
          for attempt in 1 2; do
            if npx grunt acceptance-preflight-test-ios-simulator; then
              exit 0
            fi
            echo "::warning ::iOS preflight attempt $attempt failed; retrying once (WB-54)"
          done
          exit 1

      - name: Run iOS acceptance tests
        env:
          SIM_UDID: ${{ steps.sim.outputs.udid }}
        # Retry once (WB-54). Cucumber suite takes ~15 min so a retry
        # roughly doubles the cost on a deterministic failure — but
        # acceptance flakes are common enough on macOS-15 runners that
        # the trade-off favours green over fast-fail.
        run: |
          for attempt in 1 2; do
            if npx grunt --platform=ios --simulator acceptance-test; then
              exit 0
            fi
            echo "::warning ::iOS acceptance attempt $attempt failed; retrying once (WB-54)"
          done
          exit 1

      - name: Capture simulator diagnostics on failure
        if: failure()
        run: |
          echo "=== Simulator screenshot ==="
          xcrun simctl io ${{ steps.sim.outputs.udid }} screenshot /tmp/sim-screenshot.png || true
          echo "=== Last 200 lines of ALL simulator syslog ==="
          xcrun simctl spawn ${{ steps.sim.outputs.udid }} log show --last 5m --style syslog 2>&1 | grep -i "waterbug\|titanium\|TiAPI\|TiLog\|appium\|cucumber" | tail -200 || true

      - name: Upload simulator screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-acceptance-screenshot
          path: /tmp/sim-screenshot.png
          if-no-files-found: ignore

  # ── 5. Android emulator acceptance tests ──────────────────────────────────
  android-emulator-acceptance-tests:
    name: Android emulator acceptance tests
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore node_modules cache
        id: node-modules-cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm install --ignore-scripts

      - name: Save node_modules cache
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Run install.sh
        run: sh install.sh

      - name: Add x86 ABI for emulator builds
        run: sed -i 's|<abi>arm64-v8a,armeabi-v7a</abi>|<abi>arm64-v8a,armeabi-v7a,x86</abi>|' walta-app/tiapp.xml

      - name: Read Titanium SDK version
        id: ti-version
        run: |
          TI_SDK=$(grep -o '<sdk-version>[^<]*' walta-app/tiapp.xml | cut -d'>' -f2)
          echo "version=$TI_SDK" >> "$GITHUB_OUTPUT"

      - name: Restore Titanium SDK cache
        id: ti-sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.titanium/mobilesdk/linux/${{ steps.ti-version.outputs.version }}
          key: titanium-sdk-${{ steps.ti-version.outputs.version }}-linux

      - name: Install Titanium SDK
        if: steps.ti-sdk-cache.outputs.cache-hit != 'true'
        run: npx titanium sdk install ${{ steps.ti-version.outputs.version }} --no-prompt

      - name: Save Titanium SDK cache
        if: steps.ti-sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.titanium/mobilesdk/linux/${{ steps.ti-version.outputs.version }}
          key: titanium-sdk-${{ steps.ti-version.outputs.version }}-linux

      - name: Configure Titanium
        run: npx titanium config cli.logLevel info

      - name: Apply SDK patches
        run: npm run patch-sdk

      - name: Enable KVM for hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Restore Android AVD cache
        id: avd-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
            /usr/local/lib/android/sdk/system-images/android-30
          key: avd-30-google_apis-x86

      - name: Pre-warm AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86
          avd-name: Medium_Phone_API_36.1
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: echo "AVD snapshot ready for caching"

      - name: Save Android AVD cache
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
            /usr/local/lib/android/sdk/system-images/android-30
          key: avd-30-google_apis-x86

      - name: Boot Android emulator and run acceptance tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86
          avd-name: Medium_Phone_API_36.1
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # Retry once on failure — same rationale as the unit-test job
          # above (WB-54). Wraps both preflight and acceptance so either
          # phase being hit by the AAPT flake gets a second shot.
          script: |
            echo "Emulator booted"
            for attempt in 1 2; do
              if npx grunt acceptance-preflight-test-android-emulator \
                 && npx grunt --platform=android --simulator acceptance-test; then
                exit 0
              fi
              echo "::warning ::Android acceptance attempt $attempt failed; retrying once (WB-54)"
            done
            exit 1
