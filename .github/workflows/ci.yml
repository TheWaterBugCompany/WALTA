name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 0. Detect changes ─────────────────────────────────────────────────────
  # Build/test jobs only run if files relevant to the build or its tests have
  # changed. Doc/graphics/ruleset-only PRs skip the expensive jobs entirely.
  # Skipped jobs report a "skipped" status which counts as success for
  # required-checks branch protection.
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            relevant:
              # App source & taxonomy
              - 'walta-app/**'
              - 'walta-taxonomy/walta/**'
              # Build configuration
              - 'Gruntfile.js'
              - 'package.json'
              - 'package-lock.json'
              - 'install.sh'
              - '.babelrc'
              - '.npmrc'
              - 'webpack.config.js'
              - 'patches/**'
              - 'plugins/**'
              # Build utilities
              - 'build-utils/**'
              # Test infrastructure
              - 'build-tests/**'
              - 'test/**'
              - 'test-resources/**'
              - 'features/**'
              - 'end-to-end-testing/**'
              - 'mocha-bootstrap.js'
              - 'wdio.conf.js'
              # CI workflow itself — any change re-runs everything
              - '.github/workflows/ci.yml'

  # ── 1. Node.js unit tests ─────────────────────────────────────────────────
  node-tests:
    name: Node.js unit tests
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Restore node_modules cache
        id: node-modules-cache
        uses: actions/cache/restore@v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm install --ignore-scripts

      - name: Save node_modules cache
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Run install.sh
        run: sh install.sh

      - name: Run Node.js unit tests
        run: npx grunt unit-test-node

      - name: Run cross-platform build tests
        run: npx grunt build-test

  # ── 2. iOS simulator unit tests ───────────────────────────────────────────
  # ── 2a. iOS simulator build ───────────────────────────────────────────────
  # Builds Waterbug.app once and uploads it as a workflow artifact so the
  # iOS unit and acceptance jobs can both consume it instead of each
  # rebuilding from scratch (WB-51). Tarballed before upload to preserve
  # the .app bundle's executable bits and framework symlinks, which
  # actions/upload-artifact@v7 strips otherwise.
  ios-build:
    name: iOS simulator build
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      # Pinned to match the acceptance job's WDA cache key — also used by
      # ios-simulator-tests, so all three iOS jobs share the same Xcode.
      XCODE_VERSION: "26.3"
    steps:
      - uses: actions/checkout@v6

      - name: Select pinned Xcode
        run: |
          XCODE_APP="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$XCODE_APP" ]; then
            echo "Xcode ${XCODE_VERSION} not installed on this runner. Available:" >&2
            ls /Applications | grep -E '^Xcode_' >&2
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Restore node_modules cache
        id: node-modules-cache
        uses: actions/cache/restore@v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm install --ignore-scripts

      - name: Save node_modules cache
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Run install.sh
        run: sh install.sh

      - name: Read Titanium SDK version
        id: ti-version
        run: |
          TI_SDK=$(grep -o '<sdk-version>[^<]*' walta-app/tiapp.xml | cut -d'>' -f2)
          echo "version=$TI_SDK" >> "$GITHUB_OUTPUT"

      - name: Restore Titanium SDK cache
        id: ti-sdk-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/Library/Application Support/Titanium/mobilesdk/osx/${{ steps.ti-version.outputs.version }}
          key: titanium-sdk-${{ steps.ti-version.outputs.version }}-osx

      - name: Install Titanium SDK
        if: steps.ti-sdk-cache.outputs.cache-hit != 'true'
        run: npx titanium sdk install ${{ steps.ti-version.outputs.version }} --no-prompt

      - name: Save Titanium SDK cache
        if: steps.ti-sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/Library/Application Support/Titanium/mobilesdk/osx/${{ steps.ti-version.outputs.version }}
          key: titanium-sdk-${{ steps.ti-version.outputs.version }}-osx

      - name: Configure Titanium
        run: npx titanium config cli.logLevel info

      - name: Apply SDK patches
        run: npm run patch-sdk

      - name: Select iOS simulator
        id: sim
        run: |
          # Build needs a valid sim UDID for `-C`, but doesn't require it
          # to be booted (build-only target).
          SELECTED=$(xcrun simctl list devices available -j | jq -r '
            [.devices | to_entries[]
             | select(.key | test("iOS-[0-9]"))
             | {runtime: (.key | capture("iOS-(?<v>[0-9-]+)").v),
                devices: [.value[] | select(.name | contains("iPhone")) | select(.isAvailable)]}]
            | sort_by(.runtime | split("-") | map(tonumber)) | reverse
            | .[0]
            | .devices[0] | "\(.udid) \(.name)"')
          UDID=$(echo "$SELECTED" | cut -d" " -f1)
          NAME=$(echo "$SELECTED" | cut -d" " -f2-)
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Selected: $NAME ($UDID)"

      - name: Build Waterbug.app for iOS simulator
        env:
          SIM_UDID: ${{ steps.sim.outputs.udid }}
        run: npx grunt exec:build:ios:test-sim

      - name: Tarball Waterbug.app (preserves perms + symlinks)
        run: tar -czf /tmp/waterbug-ios-sim.tgz -C builds/test-sim Waterbug.app

      - name: Upload Waterbug.app artifact
        uses: actions/upload-artifact@v7
        with:
          name: waterbug-ios-sim
          path: /tmp/waterbug-ios-sim.tgz
          retention-days: 1

  # ── 2b. iOS simulator unit tests ──────────────────────────────────────────
  ios-simulator-tests:
    name: iOS simulator unit tests
    needs: [changes, ios-build]
    if: needs.changes.outputs.relevant == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      XCODE_VERSION: "26.3"
    steps:
      - uses: actions/checkout@v6

      - name: Select pinned Xcode
        run: |
          XCODE_APP="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$XCODE_APP" ]; then
            echo "Xcode ${XCODE_VERSION} not installed on this runner. Available:" >&2
            ls /Applications | grep -E '^Xcode_' >&2
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Restore node_modules cache
        id: node-modules-cache
        uses: actions/cache/restore@v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm install --ignore-scripts

      - name: Save node_modules cache
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Run install.sh
        run: sh install.sh

      - name: Download Waterbug.app artifact
        uses: actions/download-artifact@v8
        with:
          name: waterbug-ios-sim
          path: /tmp

      - name: Extract Waterbug.app to builds/test-sim
        run: |
          mkdir -p builds/test-sim
          tar -xzf /tmp/waterbug-ios-sim.tgz -C builds/test-sim

      - name: Select iOS simulator
        id: sim
        run: |
          SELECTED=$(xcrun simctl list devices available -j | jq -r '
            [.devices | to_entries[]
             | select(.key | test("iOS-[0-9]"))
             | {runtime: (.key | capture("iOS-(?<v>[0-9-]+)").v),
                devices: [.value[] | select(.name | contains("iPhone")) | select(.isAvailable)]}]
            | sort_by(.runtime | split("-") | map(tonumber)) | reverse
            | .[0]
            | .devices[0] | "\(.udid) \(.name)"')
          UDID=$(echo "$SELECTED" | cut -d" " -f1)
          NAME=$(echo "$SELECTED" | cut -d" " -f2-)
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Selected: $NAME ($UDID)"

      - name: Boot iOS simulator
        run: |
          xcrun simctl boot ${{ steps.sim.outputs.udid }} || true
          xcrun simctl bootstatus ${{ steps.sim.outputs.udid }}
          echo "Simulator booted"

      - name: Sample simulator log format
        run: |
          xcrun simctl spawn ${{ steps.sim.outputs.udid }} log stream --style syslog 2>&1 | head -20 || true

      - name: Run iOS simulator unit tests
        env:
          SIM_UDID: ${{ steps.sim.outputs.udid }}
        # Retry once on infrastructure flake (WB-54), but skip the retry
        # if the device-side mocha runner emitted UNIT_TESTS_FAILED — a
        # deterministic failure won't pass on re-run, so retrying just
        # burns ~15 min for nothing. See WB-48.
        run: bash build-utils/run-unit-tests-with-retry.sh npx grunt --platform=ios --simulator --skip-build unit-test

      - name: Capture simulator diagnostics on failure
        if: failure()
        run: |
          echo "=== Simulator screenshot ==="
          xcrun simctl io ${{ steps.sim.outputs.udid }} screenshot /tmp/sim-screenshot.png || true
          echo "=== Last 200 lines of ALL simulator syslog ==="
          xcrun simctl spawn ${{ steps.sim.outputs.udid }} log show --last 5m --style syslog 2>&1 | grep -i "waterbug\|titanium\|TiAPI\|TiLog\|Unit Test\|mocha\|spec" | tail -200 || true
          echo "=== Check if Waterbug process is still running ==="
          xcrun simctl spawn ${{ steps.sim.outputs.udid }} launchctl list 2>&1 | grep -i waterbug || echo "Waterbug not in launchctl"
          echo "=== Check for crash reports ==="
          find ~/Library/Logs/DiagnosticReports -name "*Waterbug*" -newer /tmp/sim-screenshot.png 2>/dev/null | head -5 || echo "No crash reports found"

      - name: Upload simulator screenshot
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: simulator-screenshot
          path: /tmp/sim-screenshot.png
          if-no-files-found: ignore

  # ── 3. Android emulator unit tests ────────────────────────────────────────
  # Runs on ubuntu-latest (x86_64) with an x86_64 emulator image.
  # - x86_64 ubuntu: KVM accelerates x86_64 guests natively ✓
  # - x86_64 arch: required for API 33+, which dropped 32-bit x86 images ✓
  # - API 34 google_apis: ships the modern system photo picker (API 33+) ✓
  # - ubuntu-latest: cheapest runner option ✓
  # The AVD name "Medium_Phone_API_36.1" matches AndroidEmulatorLauncher.js.
  # ── 3a. Android emulator build ────────────────────────────────────────────
  # Builds Waterbug.apk once for the x86_64 emulator and uploads it as a
  # workflow artifact. Smaller savings than the iOS equivalent (Linux
  # gradle is fast) but kept symmetric with iOS for clarity (WB-51).
  android-build:
    name: Android emulator build
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore node_modules cache
        id: node-modules-cache
        uses: actions/cache/restore@v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm install --ignore-scripts

      - name: Save node_modules cache
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Run install.sh
        run: sh install.sh

      # API 34 emulators are x86_64-only (no 32-bit x86 images), so the
      # emulator APK needs an x86_64 slice. The vendored Bugfender module
      # ships no x86_64 lib — and dev builds disable Bugfender telemetry
      # anyway (see Logger.bugfenderEnabled) — so drop it from the emulator
      # build to keep the x86_64 packaging clean.
      - name: Add x86_64 ABI and drop Bugfender for emulator builds
        run: |
          sed -i 's|<abi>arm64-v8a,armeabi-v7a</abi>|<abi>arm64-v8a,armeabi-v7a,x86_64</abi>|' walta-app/tiapp.xml
          sed -i '/<module platform="android">be.aca.mobile.bugfender<\/module>/d' walta-app/tiapp.xml

      - name: Read Titanium SDK version
        id: ti-version
        run: |
          TI_SDK=$(grep -o '<sdk-version>[^<]*' walta-app/tiapp.xml | cut -d'>' -f2)
          echo "version=$TI_SDK" >> "$GITHUB_OUTPUT"

      - name: Restore Titanium SDK cache
        id: ti-sdk-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.titanium/mobilesdk/linux/${{ steps.ti-version.outputs.version }}
          key: titanium-sdk-${{ steps.ti-version.outputs.version }}-linux

      - name: Install Titanium SDK
        if: steps.ti-sdk-cache.outputs.cache-hit != 'true'
        run: npx titanium sdk install ${{ steps.ti-version.outputs.version }} --no-prompt

      - name: Save Titanium SDK cache
        if: steps.ti-sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.titanium/mobilesdk/linux/${{ steps.ti-version.outputs.version }}
          key: titanium-sdk-${{ steps.ti-version.outputs.version }}-linux

      - name: Configure Titanium
        run: npx titanium config cli.logLevel info

      - name: Apply SDK patches
        run: npm run patch-sdk

      # Cache Maven Central / Google jars so a Maven 403 (or rate-limit)
      # only bites the first build per cache miss instead of every run.
      # Key on the Titanium SDK version (which pins AGP / gradle) + tiapp.xml
      # (where module versions are declared); restore-keys lets a stale
      # cache populate most of the deps when only one bumps.
      - name: Cache gradle dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-ti${{ steps.ti-version.outputs.version }}-${{ hashFiles('walta-app/tiapp.xml') }}
          restore-keys: |
            gradle-${{ runner.os }}-ti${{ steps.ti-version.outputs.version }}-
            gradle-${{ runner.os }}-

      - name: Build Waterbug.apk for emulator
        run: npx grunt exec:build:android:test-sim

      - name: Upload Waterbug.apk artifact
        uses: actions/upload-artifact@v7
        with:
          name: waterbug-android-sim
          path: builds/test-sim/Waterbug.apk
          retention-days: 1

  # ── 3b. Android emulator unit tests ───────────────────────────────────────
  # Runs on ubuntu-latest (x86_64) with an x86_64 emulator image.
  # - x86_64 ubuntu: KVM accelerates x86_64 guests natively ✓
  # - x86_64 arch: required for API 33+, which dropped 32-bit x86 images ✓
  # - API 34 google_apis: ships the modern system photo picker (API 33+) ✓
  # - ubuntu-latest: cheapest runner option ✓
  # The AVD name "Medium_Phone_API_36.1" matches AndroidEmulatorLauncher.js.
  android-emulator-tests:
    name: Android emulator unit tests
    needs: [changes, android-build]
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore node_modules cache
        id: node-modules-cache
        uses: actions/cache/restore@v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm install --ignore-scripts

      - name: Save node_modules cache
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Run install.sh
        run: sh install.sh

      - name: Download Waterbug.apk artifact
        uses: actions/download-artifact@v8
        with:
          name: waterbug-android-sim
          path: builds/test-sim

      - name: Enable KVM for hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Restore Android AVD cache
        id: avd-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
            /usr/local/lib/android/sdk/system-images/android-34
          key: avd-34-google_apis-x86_64

      - name: Pre-warm AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          avd-name: Medium_Phone_API_36.1
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: echo "AVD snapshot ready for caching"

      - name: Save Android AVD cache
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
            /usr/local/lib/android/sdk/system-images/android-34
          key: avd-34-google_apis-x86_64

      - name: Boot Android emulator and run tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          avd-name: Medium_Phone_API_36.1
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # Retry once on infrastructure flake (WB-54: AAPT
          # `Theme.WaterbugApp not found` resource-linker glitch). Skip
          # the retry if the device-side mocha runner emitted
          # UNIT_TESTS_FAILED — a deterministic failure won't pass on a
          # re-run, so retrying just burns the ~2.5 min gradle+test
          # cycle for nothing. See WB-48.
          script: |
            echo "Emulator booted"
            bash build-utils/run-unit-tests-with-retry.sh npx grunt --platform=android --simulator --skip-build unit-test

  # ── 4. iOS simulator acceptance tests ─────────────────────────────────────
  ios-simulator-acceptance-tests:
    name: iOS simulator acceptance tests
    needs: [changes, ios-build]
    if: needs.changes.outputs.relevant == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      # Stable path for the prebuilt WebDriverAgent DerivedData. Cached
      # across runs and passed to Appium via the derivedDataPath capability
      # so xcuitest-driver reuses the build instead of recompiling (saves
      # ~2-3 min per acceptance run).
      WDA_DERIVED_DATA_PATH: ${{ github.workspace }}/.wda-derived
      # Pinned Xcode version — the DerivedData cache is only reusable when
      # the same Xcode/toolchain built it, and unpinned runners drift
      # between versions. 26.3 is the current App Store submission target.
      XCODE_VERSION: "26.3"
    steps:
      - uses: actions/checkout@v6

      - name: Select pinned Xcode
        run: |
          XCODE_APP="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$XCODE_APP" ]; then
            echo "Xcode ${XCODE_VERSION} not installed on this runner. Available:" >&2
            ls /Applications | grep -E '^Xcode_' >&2
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Restore node_modules cache
        id: node-modules-cache
        uses: actions/cache/restore@v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm install --ignore-scripts

      - name: Save node_modules cache
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Run install.sh
        run: sh install.sh

      - name: Download Waterbug.app artifact
        uses: actions/download-artifact@v8
        with:
          name: waterbug-ios-sim
          path: /tmp

      - name: Extract Waterbug.app to builds/test-sim
        run: |
          mkdir -p builds/test-sim
          tar -xzf /tmp/waterbug-ios-sim.tgz -C builds/test-sim

      - name: Select iOS simulator
        id: sim
        run: |
          SELECTED=$(xcrun simctl list devices available -j | jq -r '
            [.devices | to_entries[]
             | select(.key | test("iOS-[0-9]"))
             | {runtime: (.key | capture("iOS-(?<v>[0-9-]+)").v),
                devices: [.value[] | select(.name | contains("iPhone")) | select(.isAvailable)]}]
            | sort_by(.runtime | split("-") | map(tonumber)) | reverse
            | .[0]
            | .devices[0] | "\(.udid) \(.name)"')
          UDID=$(echo "$SELECTED" | cut -d" " -f1)
          NAME=$(echo "$SELECTED" | cut -d" " -f2-)
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Selected: $NAME ($UDID)"

      - name: Boot iOS simulator with Simulator.app UI
        run: |
          SIM_UDID="${{ steps.sim.outputs.udid }}"
          STATE=$(xcrun simctl list devices -j | jq -r ".devices[][] | select(.udid==\"$SIM_UDID\") | .state")
          if [ "$STATE" = "Booted" ]; then
            echo "Simulator already booted — skipping boot"
          else
            # XCUITest driver refuses to drive a simulator booted headlessly
            # via simctl — it tries to relaunch with the GUI visible and then
            # times out. Boot via Simulator.app directly so the UI is up front.
            # `bootstatus` without `-b` just waits for the in-flight boot
            # started by `open -a Simulator` to finish; with `-b` it races
            # to issue a second boot command and fails with SimError 405
            # once the device has reached "Booted" state.
            open -a Simulator --args -CurrentDeviceUDID "$SIM_UDID"
            xcrun simctl bootstatus "$SIM_UDID"
          fi
          echo "Simulator boot step complete"

      # WebDriverAgent is built from source the first time XCUITest creates
      # a session (~2-3 min). Prebuild it into a stable workspace-local
      # path and cache it. Keyed on the pinned Xcode version and the
      # appium-webdriveragent package version — not package-lock.json — so
      # unrelated dependency bumps don't invalidate the cache.
      - name: Cache prebuilt WebDriverAgent
        id: wda-cache
        uses: actions/cache@v5
        with:
          path: ${{ env.WDA_DERIVED_DATA_PATH }}
          key: wda-prebuilt-xcode-${{ env.XCODE_VERSION }}-${{ hashFiles('node_modules/appium-xcuitest-driver/node_modules/appium-webdriveragent/package.json') }}

      - name: Prebuild WebDriverAgent
        if: steps.wda-cache.outputs.cache-hit != 'true'
        run: bash build-utils/prebuild-wda.sh

      # Appium creates `node_modules/.cache/appium` on first start to hold
      # driver-hash files; caching it across runs avoids re-doing that
      # work and shaves driver-load time off every acceptance run.
      # Keyed on package-lock.json so dependency upgrades bust the cache.
      # See WB-50.
      - name: Cache Appium driver hashes
        uses: actions/cache@v5
        with:
          path: node_modules/.cache/appium
          key: appium-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            appium-cache-${{ runner.os }}-

      - name: Run iOS acceptance tests
        env:
          SIM_UDID: ${{ steps.sim.outputs.udid }}
        # WB-94: smart retry. The CucumberLauncher returns 75 (EX_TEMPFAIL
        # from BSD sysexits.h) when cucumber-js exited non-zero without
        # ever reaching scenario execution — Appium connect refused,
        # BeforeAll crash, sim/WDA not ready, etc. — meaning the
        # infrastructure was the problem and the run is retry-eligible.
        # A real test failure surfaces as cucumber-js's own exit code
        # (1, 2, ...) and is NOT retried — doubling the cost on a
        # deterministic test failure was the cost we paid under the
        # previous WB-54 retry-on-anything loop.
        run: |
          for attempt in 1 2; do
            # `|| rc=$?` keeps the grunt failure inside a list so bash's
            # default `set -e` doesn't abort the step before we can inspect
            # the code and decide whether to retry (WB-102).
            rc=0
            npx grunt --platform=ios --simulator --skip-build acceptance-test || rc=$?
            [ $rc -eq 0 ] && exit 0
            [ $rc -ne 75 ] && exit $rc
            echo "::warning ::iOS acceptance attempt $attempt returned EX_TEMPFAIL (75); retrying once (WB-94)"
          done
          exit 75

      - name: Upload per-scenario failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-failures-ios
          path: /tmp/acceptance-artifacts
          if-no-files-found: ignore

  # ── 5. Android emulator acceptance tests ──────────────────────────────────
  android-emulator-acceptance-tests:
    name: Android emulator acceptance tests
    needs: [changes, android-build]
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore node_modules cache
        id: node-modules-cache
        uses: actions/cache/restore@v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm install --ignore-scripts

      - name: Save node_modules cache
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Run install.sh
        run: sh install.sh

      - name: Download Waterbug.apk artifact
        uses: actions/download-artifact@v8
        with:
          name: waterbug-android-sim
          path: builds/test-sim

      - name: Enable KVM for hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Restore Android AVD cache
        id: avd-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
            /usr/local/lib/android/sdk/system-images/android-34
          key: avd-34-google_apis-x86_64

      - name: Pre-warm AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          avd-name: Medium_Phone_API_36.1
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: echo "AVD snapshot ready for caching"

      - name: Save Android AVD cache
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
            /usr/local/lib/android/sdk/system-images/android-34
          key: avd-34-google_apis-x86_64

      # Appium creates `node_modules/.cache/appium` on first start to hold
      # driver-hash files; caching it across runs avoids re-doing that
      # work and shaves driver-load time off every acceptance run.
      # Keyed on package-lock.json so dependency upgrades bust the cache.
      # See WB-50.
      - name: Cache Appium driver hashes
        uses: actions/cache@v5
        with:
          path: node_modules/.cache/appium
          key: appium-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            appium-cache-${{ runner.os }}-

      - name: Boot Android emulator and run acceptance tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          avd-name: Medium_Phone_API_36.1
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # Retry once on failure — same rationale as the unit-test job
          # above (WB-54). Wraps both preflight and acceptance so either
          # phase being hit by the AAPT flake gets a second shot.
          # Single-line form per the action's `sh -c`-per-line execution
          # model.
          script: |
            echo "Emulator booted"
            npx grunt --platform=android --simulator --skip-build acceptance-test || { echo "::warning ::Android acceptance first attempt failed; retrying once (WB-54)"; npx grunt --platform=android --simulator --skip-build acceptance-test; }

      - name: Upload per-scenario failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-failures-android
          path: /tmp/acceptance-artifacts
          if-no-files-found: ignore

  # ── 6. iOS simulator end-to-end tests ─────────────────────────────────────
  # Mocha+Appium full-stack tests (end-to-end-testing/). Mirrors the iOS
  # acceptance job — same prebuilt app artifact, sim boot, WDA + Appium
  # caches — but runs the `end-to-end-test` grunt task. Reserved for
  # mechanism-heavy flows device specs can't reach (e.g. kill + restart),
  # per docs/testing.md.
  ios-simulator-e2e-tests:
    name: iOS simulator end-to-end tests
    needs: [changes, ios-build]
    if: needs.changes.outputs.relevant == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      WDA_DERIVED_DATA_PATH: ${{ github.workspace }}/.wda-derived
      XCODE_VERSION: "26.3"
    steps:
      - uses: actions/checkout@v6

      - name: Select pinned Xcode
        run: |
          XCODE_APP="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$XCODE_APP" ]; then
            echo "Xcode ${XCODE_VERSION} not installed on this runner. Available:" >&2
            ls /Applications | grep -E '^Xcode_' >&2
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Restore node_modules cache
        id: node-modules-cache
        uses: actions/cache/restore@v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm install --ignore-scripts

      - name: Save node_modules cache
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Run install.sh
        run: sh install.sh

      - name: Download Waterbug.app artifact
        uses: actions/download-artifact@v8
        with:
          name: waterbug-ios-sim
          path: /tmp

      - name: Extract Waterbug.app to builds/test-sim
        run: |
          mkdir -p builds/test-sim
          tar -xzf /tmp/waterbug-ios-sim.tgz -C builds/test-sim

      - name: Select iOS simulator
        id: sim
        run: |
          SELECTED=$(xcrun simctl list devices available -j | jq -r '
            [.devices | to_entries[]
             | select(.key | test("iOS-[0-9]"))
             | {runtime: (.key | capture("iOS-(?<v>[0-9-]+)").v),
                devices: [.value[] | select(.name | contains("iPhone")) | select(.isAvailable)]}]
            | sort_by(.runtime | split("-") | map(tonumber)) | reverse
            | .[0]
            | .devices[0] | "\(.udid) \(.name)"')
          UDID=$(echo "$SELECTED" | cut -d" " -f1)
          NAME=$(echo "$SELECTED" | cut -d" " -f2-)
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Selected: $NAME ($UDID)"

      - name: Boot iOS simulator with Simulator.app UI
        run: |
          SIM_UDID="${{ steps.sim.outputs.udid }}"
          STATE=$(xcrun simctl list devices -j | jq -r ".devices[][] | select(.udid==\"$SIM_UDID\") | .state")
          if [ "$STATE" = "Booted" ]; then
            echo "Simulator already booted — skipping boot"
          else
            open -a Simulator --args -CurrentDeviceUDID "$SIM_UDID"
            xcrun simctl bootstatus "$SIM_UDID"
          fi
          echo "Simulator boot step complete"

      - name: Cache prebuilt WebDriverAgent
        id: wda-cache
        uses: actions/cache@v5
        with:
          path: ${{ env.WDA_DERIVED_DATA_PATH }}
          key: wda-prebuilt-xcode-${{ env.XCODE_VERSION }}-${{ hashFiles('node_modules/appium-xcuitest-driver/node_modules/appium-webdriveragent/package.json') }}

      - name: Prebuild WebDriverAgent
        if: steps.wda-cache.outputs.cache-hit != 'true'
        run: bash build-utils/prebuild-wda.sh

      - name: Cache Appium driver hashes
        uses: actions/cache@v5
        with:
          path: node_modules/.cache/appium
          key: appium-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            appium-cache-${{ runner.os }}-

      - name: Run iOS end-to-end tests
        env:
          SIM_UDID: ${{ steps.sim.outputs.udid }}
        # Mocha has no EX_TEMPFAIL signal to distinguish infra flake from a
        # real failure, so retry once on any failure (same rationale as the
        # Android acceptance job, WB-54).
        run: |
          npx grunt --platform=ios --simulator --skip-build end-to-end-test || { echo "::warning ::iOS e2e first attempt failed; retrying once"; npx grunt --platform=ios --simulator --skip-build end-to-end-test; }

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failures-ios
          path: /tmp/acceptance-artifacts
          if-no-files-found: ignore

