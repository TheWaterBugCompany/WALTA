name: Distribute TestFlight build

# Assigns an already-uploaded iOS build to its TestFlight group once Apple has
# finished processing it. Split out from upload-build.yml so the macOS release job can
# upload and exit (skip_waiting_for_build_processing) instead of holding an
# expensive-to-rebuild runner through Apple's async processing — the wait that
# kept cancelling the iOS job at its timeout (WB-171). Runs on cheap ubuntu.
#
# Two entry points:
#   workflow_call  — upload-build.yml chains this right after the iOS upload.
#   workflow_dispatch — manual re-assign / one-off (e.g. a build whose in-CI
#                       assignment was lost to a timeout).
#
# Selectivity (test vs prod) comes from `environment`, passed by the caller /
# operator — the same signal upload-build.yml already uses, and what the release tag
# (v<ver> vs v<ver>-test) encodes.

on:
  workflow_call:
    inputs:
      app_version:
        description: "Marketing version (CFBundleShortVersionString), e.g. 2.0.4"
        required: true
        type: string
      build_number:
        description: "Build number (CFBundleVersion), e.g. 2.0.4.51"
        required: true
        type: string
      environment:
        description: "test or production"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      app_version:
        description: "Marketing version (CFBundleShortVersionString), e.g. 2.0.4"
        required: true
        type: string
      build_number:
        description: "Build number (CFBundleVersion), e.g. 2.0.4.51"
        required: true
        type: string
      environment:
        description: "Which testing group to assign the build to"
        required: true
        type: choice
        default: test
        options: [test, production]

# No workflow-level concurrency: when called from upload-build.yml (which already
# holds the `release` group) a matching group here would deadlock the child on
# its own parent. The caller's concurrency governs the chained case; the manual
# workflow_dispatch one-off is rare enough not to need its own lock.

jobs:
  distribute:
    name: Distribute to TestFlight group
    runs-on: ubuntu-latest
    # Apple processing is normally <15 min but occasionally much slower; the poll
    # below is bounded well inside this.
    timeout-minutes: 60
    steps:
      # For .github/whats-to-test.md — the human "What to Test" notes. On the
      # chained call this is the release SHA's copy; on a manual dispatch it's the
      # ref the dispatch ran against.
      - uses: actions/checkout@v6

      - name: Install fastlane
        # ubuntu-latest's system gem dir isn't writable without sudo.
        run: sudo gem install fastlane --no-document

      - name: Assign build to its TestFlight group
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail

          # fastlane wants the ASC key as a JSON wrapper around the .p8.
          mkdir -p ~/private_keys
          echo "$ASC_KEY_BASE64" | base64 --decode > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          KEY_CONTENT=$(cat ~/private_keys/AuthKey_${ASC_KEY_ID}.p8)
          jq -n \
            --arg key_id "$ASC_KEY_ID" \
            --arg issuer_id "$ASC_ISSUER_ID" \
            --arg key "$KEY_CONTENT" \
            '{key_id: $key_id, issuer_id: $issuer_id, key: $key, in_house: false}' \
            > /tmp/asc_key.json

          # test  → Sandbox Api Testers (internal; automatic distribution is OFF,
          #         so this explicit assignment is the only thing that reaches
          #         internal testers; no Beta App Review).
          # prod  → Production Api Testers (external; submits to Beta App Review
          #         and notifies testers on approval; needs a changelog).
          # submit_beta_review defaults to true in pilot and gates on
          # (groups || distribute_external) — pass it explicitly so an internal
          # assignment doesn't silently trigger review.
          # A build identifier line — the only tester-visible test/prod signal in
          # TestFlight's aggregated build list (iOS CFBundleVersion can't carry a
          # -test suffix), so label both, test builds especially.
          if [ "${{ inputs.environment }}" = "production" ]; then
            GROUP="Production Api Testers"
            EXTERNAL=true
            SUBMIT_REVIEW=true
            LABEL="Release ${{ inputs.build_number }}"
          else
            GROUP="Sandbox Api Testers"
            EXTERNAL=false
            SUBMIT_REVIEW=false
            LABEL="TEST BUILD - sandbox CERDI server (${{ inputs.build_number }})"
          fi

          # "What to Test" = the build label + the repo's release-focus notes, so
          # testers know what changed. Edit .github/whats-to-test.md per release;
          # a missing/empty file just falls back to the label alone.
          CHANGELOG="$LABEL"
          NOTES_FILE=".github/whats-to-test.md"
          if [ -s "$NOTES_FILE" ]; then
            CHANGELOG="$LABEL"$'\n\n'"$(cat "$NOTES_FILE")"
          fi

          # Poll for the build to become distributable. pilot distribute errors
          # ("No build to distribute!") while Apple is still processing the build;
          # this waits for that external async state to settle, then assigns. It is
          # NOT a retry to mask a bug — a persistent failure exhausts the bound and
          # fails the job loudly.
          for attempt in $(seq 1 40); do
            if fastlane pilot distribute \
                 --api_key_path /tmp/asc_key.json \
                 --app_identifier net.thewaterbug.waterbug \
                 --app_platform ios \
                 --app_version "${{ inputs.app_version }}" \
                 --build_number "${{ inputs.build_number }}" \
                 --groups "$GROUP" \
                 --distribute_external "$EXTERNAL" \
                 --notify_external_testers "$EXTERNAL" \
                 --submit_beta_review "$SUBMIT_REVIEW" \
                 --changelog "$CHANGELOG"; then
              echo "Assigned build ${{ inputs.build_number }} to \"$GROUP\"."
              exit 0
            fi
            echo "Build not distributable yet (attempt $attempt/40) — waiting for Apple processing…"
            sleep 45
          done
          echo "::error::Build ${{ inputs.build_number }} never became distributable within the poll window."
          exit 1
