version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    ignore:
      # liveview is pinned to our fork on a custom branch — we manage it manually
      - dependency-name: "liveview"
      # chai 6 is ESM-only and breaks the in-app mocha unit test harness
      - dependency-name: "chai"
        versions: [">=5"]
      # vite 5+ is ESM-only; walta-app/vite.config.js uses require('vite')
      # and Titanium's liveview loads it via CJS — same failure mode as chai.
      - dependency-name: "vite"
        versions: [">=5"]
      # @babel/preset-env 8 needs @babel/core 8, but Titanium SDK 13.2.0.GA
      # bundles an older core — the native build's babel pass over app.js dies
      # with "api.targets is not a function". Needs a Ti SDK that ships core 8.
      - dependency-name: "@babel/preset-env"
        versions: [">=8"]
      # Appium driver majors are now ESM-only and change driver behaviour; hold
      # until a scoped Appium harness upgrade verifies the acceptance suite.
      - dependency-name: "appium-uiautomator2-driver"
        versions: [">=8"]
      - dependency-name: "appium-xcuitest-driver"
        versions: [">=12"]
    groups:
      dev-dependencies:
        dependency-type: "development"
      production-dependencies:
        dependency-type: "production"
